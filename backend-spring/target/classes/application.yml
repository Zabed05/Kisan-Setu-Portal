server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: kpip-platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kpip}
    username: ${SPRING_DATASOURCE_USERNAME:kpip_user}
    password: ${SPRING_DATASOURCE_PASSWORD:kpip_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:kpip_jwt_secret_key_sih_2026_authority_key}
  expiration: 86400000 # 24 hours in milliseconds
